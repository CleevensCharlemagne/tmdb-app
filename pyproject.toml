[project]
name = "tmdb-app"
version = "0.1.0"
description = "A CLI app for fetching movies from TMDB"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests"
]

[project.scripts]
tmdb-app = "tmdb_app.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"